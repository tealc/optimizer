# Fork only: tests the custom branch and builds it into ghcr.io/<owner>/<repo>:custom for the home NAS.
name: Fork image

on:
  push:
    branches: [custom]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.repository_owner != 'evcc-io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv run autopep8 --recursive --exit-code --diff .
      - run: uv run ruff check
      # same CBC build as the image and the upstream CI
      - name: Install CBC
        run: |
          curl -sSL https://github.com/coin-or/Cbc/releases/download/releases%2F2.10.13/Cbc-releases.2.10.13-x86_64-ubuntu22-gcc1140-static.tar.gz \
            | sudo tar xz -C /usr/local ./bin/cbc
          echo | cbc | grep -q 'Version: 2.10.13'
      - run: uv run pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:custom
            ${{ env.IMAGE }}:custom-${{ github.sha }}
